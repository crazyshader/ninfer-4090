[pytest]
testpaths = tests
# 把 launcher/ 自身加入 sys.path，使 tests 能 import ninfer_launcher
pythonpath = .
# 标记注册（避免 PytestUnknownMarkWarning）：
#   smoke      快速验证集（pytest -m smoke）
#   realsystem 需要本机真实 NVIDIA 驱动、会读写显卡全局设置的核对用例（默认不跑，
#              复跑时显式加 -m realsystem）
markers =
    smoke: 快速验证集，核心链路用例
    realsystem: 需要本机真实 NVIDIA 驱动的核对用例（会读写显卡全局设置，默认不跑）
# 默认套件不跑 realsystem——默认运行绝不碰真实显卡驱动设置。
addopts = -ra -m "not realsystem"
